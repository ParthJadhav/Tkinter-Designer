<svg xmlns="http://www.w3.org/2000/svg" width="500" height="124" viewBox="0 0 500 124" role="img" aria-labelledby="title desc">
  <title id="title">Product Hunt number 8 on launch day</title>
  <desc id="desc">Tkinter Designer ranked number 8 on Product Hunt's daily leaderboard on September 19, 2021.</desc>
  <rect x="1" y="1" width="498" height="122" rx="19" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="21" y="25" width="74" height="74" rx="18" fill="#f3edff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#48248f">
    <text x="58" y="48" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1">RANK</text>
    <text x="58" y="82" text-anchor="middle" font-size="33" font-weight="700">8</text>
    <text x="114" y="37" font-size="16" font-weight="700" letter-spacing="1.4">PRODUCT HUNT</text>
