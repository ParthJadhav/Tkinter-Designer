[project]
name = "tkdesigner"
version = "2.0.0a1"
description = "Inspect Figma designs and generate maintainable Tkinter applications"
authors = [
    { name = "Parth Jadhav", email = "jadhavparth99@gmail.com" }
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.31,<3",
    "Jinja2>=3.1,<4",
    "Pillow>=11,<13",
]
keywords = ["tkinter", "figma", "code-generation", "gui", "design-to-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ParthJadhav/Tkinter-Designer"
Repository = "https://github.com/ParthJadhav/Tkinter-Designer"
Documentation = "https://github.com/ParthJadhav/Tkinter-Designer#readme"
"Bug Tracker" = "https://github.com/ParthJadhav/Tkinter-Designer/issues"
Changelog = "https://github.com/ParthJadhav/Tkinter-Designer/blob/master/CHANGELOG.md"

[project.scripts]
tkdesigner = "tkdesigner.cli:main"
tkdesigner-gui = "tkdesigner.gui_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "flake8>=7,<8",
    "build>=1.2,<2",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
