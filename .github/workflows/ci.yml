name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e . pytest flake8 build
      - name: Lint
        run: flake8 . --exclude=.venv
      - name: Test
        run: pytest -q
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
